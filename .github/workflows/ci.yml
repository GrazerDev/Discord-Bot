name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Validate command schema
        run: npm run check
      - name: Database + helper tests
        run: npm run test:db
      - name: Command execution tests
        run: npm run test:cmds
