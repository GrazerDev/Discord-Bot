services:
  bot:
    build: .
    container_name: nexus-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/bot.db
      - PORT=8080
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
